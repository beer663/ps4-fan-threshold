name: Build 74C Payload

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build SDK
        run: |
          git clone --depth 1 https://github.com/Scene-Collective/ps4-payload-sdk.git "$RUNNER_TEMP/ps4-payload-sdk"
          make -C "$RUNNER_TEMP/ps4-payload-sdk/libPS4"
          echo "PS4SDK=$RUNNER_TEMP/ps4-payload-sdk" >> "$GITHUB_ENV"

      - name: Build payload
        run: |
          make
          cp "$(basename "$PWD").bin" "$RUNNER_TEMP/ps4-fan-74.bin"

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ps4-fan-74
          path: ${{ runner.temp }}/ps4-fan-74.bin
          if-no-files-found: error
